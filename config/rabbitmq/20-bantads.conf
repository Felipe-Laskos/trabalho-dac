
# Testado relative=0.6 nesta tarefa (S8) e revertido: o RabbitMQ deste
# ambiente nao enxerga o cgroup do conteiner (vm_memory_monitor:
# get_total_memory() devolve a RAM do host inteiro, nao os 512MiB do
# mem_limit) — relative=0.6 vira ~60% do host, um teto que o conteiner
# nunca alcanca antes do cgroup matar por OOM em 512MiB. Absoluto,
# calibrado pro mem_limit atual, e o que protege de verdade. Se mudar
# o mem_limit do rabbitmq no docker-compose.yml, recalcular este valor
# a mao (60% dele) — nao ha deteccao automatica aqui. Ver tools/MEMORIA.md.
vm_memory_high_watermark.absolute = 307MiB
