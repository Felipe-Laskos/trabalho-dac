<div class="app-layout">

  <p-toolbar>

    <ng-template #start>
      <span class="brand-name">BANTADS</span>
    </ng-template>

    <ng-template #end>
      <span class="header-user">{{ nomeUsuario() }}</span>
      <p-button
        label="Sair"
        icon="pi pi-sign-out"
        severity="secondary"
        variant="text"
        (onClick)="sair()" />
    </ng-template>

  </p-toolbar>

  <div class="app-body">

    <aside class="app-sidebar">

      <p-menu [model]="menuItems()"></p-menu>

    </aside>

    <main class="app-content">

      <router-outlet></router-outlet>

    </main>

  </div>

  <app-toast></app-toast>

</div>
