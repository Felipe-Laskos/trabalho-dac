server.port=8080

spring.application.name=ms-gerente

# PostgreSQL
spring.datasource.url=${GERENTE_DB_URL:jdbc:postgresql://postgres:5432/bantads?currentSchema=gerente}
spring.datasource.username=${GERENTE_DB_USER:postgres}
spring.datasource.password=${GERENTE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=GerentePool

# JPA / Hibernate
spring.jpa.properties.hibernate.default_schema=gerente
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Logs dos pools
logging.level.com.zaxxer.hikari=INFO

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=5000
spring.rabbitmq.listener.simple.retry.multiplier=1.0
spring.rabbitmq.listener.simple.default-requeue-rejected=false
