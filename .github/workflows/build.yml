name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ms: [ms-auth, ms-cliente, ms-conta, ms-gerente, ms-orquestrador, ms-email]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: compila ${{ matrix.ms }}
        working-directory: ${{ matrix.ms }}
        run: mvn -B -ntp -DskipTests package

  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [gateway, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: instala
        working-directory: ${{ matrix.app }}
        run: npm ci
      - name: compila ${{ matrix.app}}
        working-directory: ${{ matrix.app }}
        run: |
          if [ "${{ matrix.app }}" = "frontend" ]; then
            npm run build
          else
            node --check index.js
          fi

  build-ok:
    if: always()
    needs: [backend, node]
    runs-on: ubuntu-latest
    steps:
      - name: portao
        run: |
          [ "${{ needs.backend.result }}" = "success" ] || exit 1
          [ "${{ needs.node.result }}" = "success" ] || exit 1
